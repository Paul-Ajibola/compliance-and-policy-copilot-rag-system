services:
  db:
    image: pgvector/pgvector:pg16
    container_name: compliance_copilot_db
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-compliance_copilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: compliance_copilot_backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./eval:/app/eval

  frontend:
    build:
      context: ./frontend
    container_name: compliance_copilot_frontend
    restart: unless-stopped
    network_mode: host
    environment:
      BACKEND_INTERNAL_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata: